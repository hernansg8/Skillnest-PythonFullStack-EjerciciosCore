<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <section>
        <header class="row space-between align-center">
            <h1>{{evento.nombre_evento}}</h1>
            <div class="row">
                <form action="/eventos" style="margin: 10px;">
                    <button type="submit">Inicio</button>
                </form>
                <form action="/cerrarsesion" style="margin: 10px;">
                    <button type="submit">Cerrar Sesión</button>
                </form>
            </div>
        </header>
    </section>
    <section class="align-left">
        <p><span>Publicado por: </span>{{evento.nombre}} {{evento.apellido}}</p>
    </section>
    <section class="tarjeta">
        <div class="grid-form">
            <p><span>Ubicación: </span></p>
            <p>{{evento.ubicacion}}</p>
            <p><span>Fecha: </span></p>
            <p>{{evento.fecha}}</p>
            <p><span>Detalles: </span></p>
            <p>{{evento.detalles}}</p>
        </div>
    </section>
</body>
</html>
