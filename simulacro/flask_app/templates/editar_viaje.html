<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Viaje</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="row">
        <h1>Editar Viaje</h1>
        <a href="/dashboard" class="btn btn-primary">Inicio</a>
        <a href="/cerrarsesion" class="btn btn-primary">Cerrar Sesión</a>
    </header>
    <main>
        <form action="/editar/save" method="POST" class="tarjeta">
            <input type="text" name="id" value="{{viaje.id}}" hidden>

            <label>Destino:</label>
            <input type="text" name="destino" value="{{viaje.destino}}" required><br>

            <label>Fecha de Inicio:</label>
            <input type="date" name="fecha_inicio" value="{{viaje.fecha_inicio}}" required><br>

            <label>Fecha de Fin:</label>
            <input type="date" name="fecha_fin" value="{{viaje.fecha_fin}}" required><br>

            <label>Itinerario:</label>
            <input type="text" name="itinerario" maxlength="40"  value="{{viaje.itinerario}}" style="height: 200px;" required><br>

            <input type="text" name="organizador" value="{{viaje.organizador_id}}" hidden>
            
            <input type="submit" value="Guardar" class="btn btn-primary mt-2">
        </form>
    </main>
</body>
</html>
