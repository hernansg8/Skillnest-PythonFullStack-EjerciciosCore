<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Viaje</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <section>
        <header class="row space-between align-center">
            <h1>Editar Viaje</h1>
            <div class="row">
                <form action="/dashboard" style="margin: 10px;">
                    <button type="submit">Inicio</button>
                </form>
                <form action="/cerrarsesion" style="margin: 10px;">
                    <button type="submit">Cerrar Sesión</button>
                </form>
            </div>
        </header>
        {% with messages = get_flashed_messages(with_categories=true) %}<!-- declara una variable llamada mensajes -->
            {% if messages %}<!-- revisa si hay algún mensaje -->
                <ul class="flashes">
                {% for category, message in messages %}   <!-- recorre los mensajes -->
                    {% if category in 'error, success' %}
                    <li class="{{category}}">{{message}}</li>  <!-- muestra cada mensaje en una etiqueta de párrafo -->
                    {% endif %}
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <form action="/editar/save" method="POST" class="grid-form tarjeta">
            <input type="text" name="id" value="{{viaje.id}}" hidden>

            <label for="destino">Destino:</label>
            <input type="text" name="destino" id="destino" value="{{viaje.destino}}" required>

            <label for="fecha_inicio">Fecha de Inicio:</label>
            <input type="date" name="fecha_inicio" id="fecha_inicio" value="{{viaje.fecha_inicio}}" required>

            <label for="fecha_fin">Fecha de Fin:</label>
            <input type="date" name="fecha_fin" id="fecha_fin" value="{{viaje.fecha_fin}}" required>

            <label for="itinerario">Itinerario:</label>
            <textarea name="itinerario" id="itinerario" rows="4" cols="10">{{viaje.itinerario}}</textarea>

            <input type="text" name="organizador" value="{{viaje.organizador_id}}" hidden>
            
            <button type="submit">Guardar</button>
        </form>
    </section>
</body>
</html>
